name = "esteri-api"
main = "src/worker.js"
# Päivämäärä lukitsee ajonaikaisen käyttäytymisen ja on olemassa suojaamaan jo
# deployattua Workeria. Worker on deployattu ja tuotannossa, joten nosto ei ole
# enää ilmainen: se on tehtävä muutoslokia vasten.
compatibility_date = "2026-08-03"

# Molemmat olisivat oletuksena päällä. Ne kirjataan tähän, jotta arvo on päätös
# eikä oletus.
#
# workers.dev-osoite on tarkoitettu julkiseksi: sovellus kutsuu sitä suoraan.
# Osoite on https://esteri-api.weellu.workers.dev — sama arvo menee sovelluksen
# ESTERI_API-määrittelyyn ja GitHubin CONTRIBUTION_API_BASE-muuttujaan.
workers_dev = true
# Preview-osoitteet käyttävät samoja bindingejä kuin tuotanto, eli jokainen
# aiemmin julkaistu versio jäisi tavoitettavaksi kirjoittaen samaan D1-kantaan.
# Tälle palvelulle ei ole preview-työnkulkua, joten se olisi pelkkää pinta-alaa.
preview_urls = false

# Ilmaistasolla riittää yksi Worker ja yksi D1-kanta. Mitoitus: 100 000
# pyyntöä ja 100 000 kirjoitettua riviä vuorokaudessa. Karkea arvio
# käytöstä — 10 000 käyttäjää, kaksi vahvistusta viikossa — on noin
# 3 000 kirjoitusta vuorokaudessa eli kolmisen prosenttia kiintiöstä.

[[d1_databases]]
# Bindingin nimi on Workerin koodin sopimus (env.DB), ei kannan nimi.
# `wrangler d1 create` ehdottaa tulosteessaan bindingiksi kannan nimeä —
# sitä ei pidä kopioida tänne sellaisenaan.
binding = "DB"
database_name = "esteri"
# Tunniste ei ole salaisuus vaan osoite. Se kuuluu versionhallintaan, jotta
# tuore klooni deployaa samaan kantaan eikä luo uutta.
database_id = "256b0941-3e10-4fb9-949e-8022f1d1c4c0"

# Salaisuudet asetetaan erikseen eikä tähän tiedostoon:
#   wrangler secret put MODERATION_TOKEN   # moderointiajon lukuoikeus
#   wrangler secret put IP_SALT            # rate limitin IP-tiivisteen suola
#   wrangler secret put MML_API_KEY        # karttatiilet ja geokoodaus
#
# MML_API_KEY ei saa päätyä repoon eikä sovellukseen. Sovellus kutsuu
# /v1/tiles ja /v1/geocode -reittejä, jotka lisäävät avaimen vasta täällä:
# käännökseen upotettu avain olisi kaivettavissa binäärista eikä vaihdettavissa
# ilman kauppakierrosta. Avaimen voi vaihtaa milloin tahansa ajamalla saman
# komennon uudelleen ja deployaamalla.
#
# IP_SALT ei ole vaihdettavissa jälkikäteen menettämättä kuluvan vuorokauden
# rate limit -laskureita. Se on hyväksyttävää: laskurit vanhenevat itsestään.

# Väärinkäytön rajoitus MML-välitykselle.
#
# WAF:n rate limiting -säännöt ovat vyöhykekohtaisia, eikä workers.dev ole
# meidän vyöhykkeemme — sääntöä ei siis voi kiinnittää mihinkään Cloudflaren
# hallinnasta. Tämä binding toimii ilman omaa domainia.
#
# Rajat ovat väljät tarkoituksella. Kylmällä välimuistilla yksi kartan avaus
# hakee kymmeniä tiiliä, ja vilkas selailu enemmän, joten liian tiukka raja
# rikkoisi tavallisen käytön. Tarkoitus on pysäyttää kaapija, ei käyttäjä.
#
# Huom: laskurit ovat konesalikohtaisia ja eventually consistent. Todellinen
# yhteenlaskettu raja on siis korkeampi kuin tässä lukee. Tämä on karkea
# suojaus, ei kirjanpito.
[[ratelimits]]
name = "TILE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 200
  period = 10

# Haku on murto-osa tiilien määrästä: sovellus lähettää kutsun vasta 350 ms:n
# tauon jälkeen ja vain kahdesta merkistä alkaen, ja välimuistittaa tulokset.
# Siksi tämä saa olla selvästi tiukempi.
[[ratelimits]]
name = "GEOCODE_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

[observability]
enabled = true
